# Los chequeos que valen para toda la organización viven en el repositorio
# `.github`, así que acá se los llama y no se los copia: cambiarlos es
# cambiarlos en un solo lugar. Las pruebas de Rust tenían un trabajo propio
# acá, por los paquetes de sistema que pide el grafo; el flujo compartido ya
# los instala (`paquetes_rust`) y ahí además se mide la cobertura.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # Sólo lectura. Estos chequeos clonan, instalan dependencias y comprueban:
    # no comentan, no etiquetan, no publican.
    #
    # El workflow llamado declara lo mismo en su trabajo, que es donde el
    # permiso se aplica; esto lo escribe también acá porque el análisis
    # estático de este repositorio no puede ver el otro archivo, y ahí un
    # trabajo sin `permissions` se lee como permisos por omisión.
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/app.yml@main
    # Sólo el token de SonarQube Cloud, y por nombre: `secrets: inherit`
    # le daría también el de crates.io y el de npm a un trabajo que
    # instala dependencias de terceros.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    # El guardia de bibliotecas propias atrasadas corta en vez de avisar. Este
    # repositorio ya está al día, así que encenderlo no bloquea nada hoy y evita
    # volver a quedarse atrás sin que nada falle, que es lo que hace un `^2.5.0`
    # que ya se cumple con la 2.5.
    with:
      bibliotecas_cortan: true
      # Las pruebas de Rust corren en `revisar` y de esa misma corrida sale la
      # cobertura que se le pasa a Sonar. Antes corrían en un trabajo propio de
      # este repositorio, sin cobertura: Sonar no veía el Rust como código a
      # cubrir, y un PR que sólo tocaba Rust pasaba la puerta sin que se
      # midiera nada (Vasak-OS/vasak-flare-daemon#37). El flujo compartido ya
      # instala paquetes de sistema (`paquetes_rust`), que era lo que obligaba
      # a tener el trabajo acá.
      pruebas_rust: -p vasak-shot
      # La lista sale de los `.pc` que este grafo pide de verdad, no de la
      # lista de Tauri:
      #
      #   libwebkit2gtk-4.1-dev   webkit2gtk, gtk3, soup3 y el resto de la pila
      #                           de GTK; trae también `dbus-1` para `libdbus-sys`
      #   libgtk-layer-shell-dev  la ventana de recorte va en la capa del
      #                           compositor —tapa el panel entero—, y
      #                           `gtk-layer-shell` es dependencia directa
      #   lld                     `src-tauri/.cargo/config.toml` enlaza con
      #                           `-fuse-ld=lld`, y la imagen del runner no lo trae
      #   build-essential         el compilador de C de los `-sys`
      #
      # Que un `.pc` falte no es un aviso: los `build.rs` de los `-sys` llaman a
      # `process::exit(1)`, así que se ve como un crate que no compila, a mitad
      # del grafo y muy lejos de la causa.
      paquetes_rust: >-
        libwebkit2gtk-4.1-dev
        libgtk-layer-shell-dev
        lld
        build-essential
