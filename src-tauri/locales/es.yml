_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Aplicación Vasak
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
inicio:
  titulo: Hola, VasakOS
  descripcion: Esta es la plantilla. Reemplazá esta pantalla por la tuya.
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  saludo: "Hola, {0}"
shot:
  errorImagen: No se pudo mostrar la captura. Es un problema de configuración, no de la pantalla.
  instruccion: Arrastrá para elegir una zona, o hacé clic para toda la pantalla
  copiar: Copiar
  guardar: Guardar
  cancelar: Cancelar
  copiada: Copiada al portapapeles
  guardadaEn: "Guardada en {0}"
  teclaCopiar: Ctrl+C
  teclaGuardar: Intro
  teclaCancelar: Esc
  preferencias: Preferencias
  cerrar: Cerrar
  aplicar: Aplicar
  restablecer: Por omisión
  alSoltarTitulo: Al soltar el botón
  alSoltarGuardarYCopiar: Guardar y copiar
  alSoltarGuardar: Guardar
  alSoltarCopiar: Copiar al portapapeles
  alSoltarEsperar: Esperar, para anotarla y decidir con los botones
  carpeta: Carpeta donde se guardan
  instruccionConVentanas: Arrastrá para elegir una zona, hacé clic en una ventana, o en el fondo para toda la pantalla
  ajustar: Ajustar
  relleno: Relleno
  deshacer: Deshacer
  rehacer: Rehacer
  herramientaRecuadro: Recuadro
  herramientaElipse: Elipse
